  .label { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #24292f; }
  .value { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0969da; }
  @media (prefers-color-scheme: dark) {
