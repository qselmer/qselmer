<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" role="img" aria-label="GitHub Profile">
<style>
  .card { fill: #ffffff; stroke: #d0d7de; }
  .title { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0969da; }
  .label { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #24292f; }
  .value { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0969da; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0d1117; stroke: #30363d; }
    .title, .value { fill: #58a6ff; }
    .label { fill: #c9d1d9; }
  }
</style>
<rect class="card" x="0.5" y="0.5" width="409" height="209" rx="8"/>
<text x="24" y="37" class="title">GitHub Profile</text>
<text x="24" y="72" class="label">Public repositories</text><text x="386" y="72" text-anchor="end" class="value">64</text><text x="24" y="101" class="label">Original public repositories</text><text x="386" y="101" text-anchor="end" class="value">16</text><text x="24" y="130" class="label">Repository stars</text><text x="386" y="130" text-anchor="end" class="value">0</text><text x="24" y="159" class="label">Repository forks</text><text x="386" y="159" text-anchor="end" class="value">1</text><text x="24" y="188" class="label">Followers</text><text x="386" y="188" text-anchor="end" class="value">33</text>
</svg>