<svg xmlns="http://www.w3.org/2000/svg" width="410" height="190" viewBox="0 0 410 190" role="img" aria-label="Top Languages">
<style>
  .card { fill:#ffffff; stroke:#d0d7de; }
  .title { font:600 18px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill:#0969da; }
  .label { font:400 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill:#57606a; }
  .value { font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill:#24292f; }
  @media (prefers-color-scheme: dark) { .card{fill:#0d1117;stroke:#30363d} .title{fill:#58a6ff} .label{fill:#8b949e} .value{fill:#c9d1d9} }
</style>
<rect class="card" x="0.5" y="0.5" rx="8" width="409" height="189"/>
<text x="24" y="36" class="title">Top Languages</text>
<text x="24" y="68" class="label">Status</text><text x="386" y="68" text-anchor="end" class="value">Awaiting workflow run</text>
