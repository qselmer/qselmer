name: Profile hierarchy v2 migration

on:
  push:
    branches: [refactor/profile-hierarchy-v2]
    paths:
      - "scripts/_migrate_profile_hierarchy_v2.py"
      - ".github/workflows/profile-hierarchy-v2-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply source migration
        run: python scripts/_migrate_profile_hierarchy_v2.py

      - name: Render refined README
        run: python scripts/render_profile.py

      - name: Validate
        run: |
          python -m py_compile scripts/update_profile.py scripts/render_profile.py
          python -m unittest discover -s tests -v
          python -m json.tool assets/data/repository-catalog.json >/dev/null
          python -m json.tool assets/data/organizational-contributions.json >/dev/null

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finalize profile hierarchy v2"
          git push
