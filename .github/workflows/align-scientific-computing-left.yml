name: Align scientific computing badges left

on:
  push:
    branches:
      - main
    paths:
      - scripts/align_scientific_computing_left.py
      - .github/workflows/align-scientific-computing-left.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Align scientific computing badges left
        run: python scripts/align_scientific_computing_left.py

      - name: Validate
        run: |
          python -m py_compile scripts/*.py
          python - <<'PY'
          from pathlib import Path
          renderer = Path('scripts/render_profile.py').read_text(encoding='utf-8')
          start = renderer.index('SCIENTIFIC_COMPUTING_BLOCK = """')
          end = renderer.index('"""\n\nMETRICS_NOTE', start)
          block = renderer[start:end]
          assert block.count('<p align="left">') == 2
          assert '<p align="center">' not in block
          readme = Path('README.md').read_text(encoding='utf-8')
          start = readme.index('## Scientific computing\n')
          end = readme.index('\n## Scientific computing & reproducible research', start)
          block = readme[start:end]
          assert block.count('<p align="left">') == 2
          assert '<p align="center">' not in block
          print('Scientific computing badges are left-aligned in renderer and README.')
          PY

      - name: Remove one-off migration files
        run: |
          git rm scripts/align_scientific_computing_left.py
          git rm .github/workflows/align-scientific-computing-left.yml

      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/render_profile.py
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: left-align scientific computing badges"
            git push
          fi
