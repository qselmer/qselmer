name: Fix profile note idempotence

on:
  push:
    branches: [fix/profile-card-note-idempotence]
    paths:
      - "scripts/_fix_profile_note_idempotence.py"
      - ".github/workflows/fix-profile-note-idempotence.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply fix
        run: python scripts/_fix_profile_note_idempotence.py

      - name: Render README
        run: python scripts/render_profile.py

      - name: Validate
        run: |
          python -m py_compile scripts/render_profile.py
          python -m unittest discover -s tests -v

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make profile card refinement idempotent"
          git push
