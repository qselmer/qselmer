name: Run profile layout v4 migration

on:
  push:
    branches:
      - refactor/profile-layout-v4
    paths:
      - scripts/migrate_profile_layout_v4.py
      - .github/workflows/run-profile-layout-v4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/profile-layout-v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python scripts/migrate_profile_layout_v4.py

      - name: Render README
        run: python scripts/render_profile.py

      - name: Validate
        run: |
          python -m py_compile scripts/render_profile.py scripts/update_profile.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          assert '## Research outputs & metrics' not in text
          assert '<h1 align="center">Elmer Quispe-Salazar</h1>' in text
          assert '<h1 align="center">Marine Quantitative Ecologist & Fisheries Scientist</h1>' in text
          assert text.index('assets/generated/research-outputs.svg') < text.index('## Research focus')
          assert text.index('## Research focus') < text.index('assets/generated/top-languages.svg')
          assert 'Private repositories remain included in Repository Types counts but are not listed below.' not in text
          assert '🔒 Private repository.' in text
          PY

      - name: Commit migration result
        run: |
          rm -f .github/workflows/profile-layout-v4-migration.yml
          rm -f .github/workflows/run-profile-layout-v4.yml
          rm -f scripts/migrate_profile_layout_v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate research cards and show private repositories"
          git push
