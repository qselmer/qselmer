name: Replace em dash across repository

on:
  push:
    branches:
      - main
    paths:
      - scripts/replace_em_dash_repo.py
      - .github/workflows/replace-em-dash-repo.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Replace em dash in all tracked UTF-8 files
        run: python scripts/replace_em_dash_repo.py

      - name: Validate repository
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          root = Path('.')
          target = chr(0x2014)
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          offenders = []
          for item in raw.split(b'\0'):
              if not item:
                  continue
              path = root / item.decode('utf-8')
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if target in text:
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('Em dash still present in: ' + ', '.join(offenders))
          print('No em dash remains in tracked UTF-8 files.')
          PY
          python -m py_compile scripts/*.py
          python -m pytest -q

      - name: Remove one-off migration files
        run: |
          git rm scripts/replace_em_dash_repo.py
          git rm .github/workflows/replace-em-dash-repo.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: replace em dash with hyphen across repository"
            git push
          fi
