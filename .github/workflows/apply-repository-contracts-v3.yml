name: Apply repository contracts v3

on:
  push:
    branches:
      - audit/repo-yml-contracts-v3

permissions:
  contents: write

concurrency:
  group: repository-contracts-v3
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: audit/repo-yml-contracts-v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install profile dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-profile.txt

      - name: Apply migration
        run: python scripts/apply_repository_contracts_v3.py

      - name: Validate migration
        run: |
          python -m py_compile scripts/update_profile.py scripts/render_profile.py scripts/repository_contracts.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('assets/data/repository-types.json').read_text())
          print('repository type configuration valid')
          PY

      - name: Remove migration-only files and commit
        run: |
          rm scripts/apply_repository_contracts_v3.py
          rm .github/workflows/apply-repository-contracts-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use repo.yml as canonical repository contract [skip ci]"
          git push origin HEAD:audit/repo-yml-contracts-v3
