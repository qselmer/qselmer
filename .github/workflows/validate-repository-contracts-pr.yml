name: Validate repository contract migration

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/profile_refresh.py"
      - "scripts/profile_render.py"
      - "scripts/repository_contracts.py"
      - "requirements-profile.txt"
      - "tests/test_repository_contracts.py"
      - ".github/workflows/update-profile.yml"
      - "AUTOMATION.md"

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'audit/repo-yml-contracts-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-profile.txt
      - name: Compile profile pipeline
        run: python -m py_compile scripts/update_profile.py scripts/render_profile.py scripts/profile_refresh.py scripts/profile_render.py scripts/repository_contracts.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
