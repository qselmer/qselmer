name: Apply short hyphen summary

on:
  push:
    branches:
      - fix/short-hyphen-summary
    paths:
      - scripts/apply_short_hyphen_summary.py
      - .github/workflows/apply-short-hyphen-summary.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/short-hyphen-summary
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply changes
        run: python scripts/apply_short_hyphen_summary.py

      - name: Validate
        run: |
          python -m py_compile scripts/update_profile.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/update_profile.py')
          spec = importlib.util.spec_from_file_location('update_profile_check', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.format_metric(0) == '-'
          assert mod.format_metric('0') == '-'
          assert mod.format_metric(None) == '-'
          assert mod.format_metric(5) == '5'
          PY
          grep -q '>Projects</text><text[^>]*>-</text>' assets/generated/repository-types.svg
          grep -q '>Books &amp; chapters</text><text[^>]*>-</text>' assets/generated/research-outputs.svg
          grep -q '>Citations (OpenAlex)</text><text[^>]*>-</text>' assets/generated/research-metrics.svg

      - name: Remove one-off migration files
        run: |
          git rm scripts/apply_short_hyphen_summary.py
          git rm .github/workflows/apply-short-hyphen-summary.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_profile.py tests/test_profile_v2.py assets/generated/repository-types.svg assets/generated/research-outputs.svg assets/generated/research-metrics.svg
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "fix: use short hyphens for zero summary values"
            git push
          fi
