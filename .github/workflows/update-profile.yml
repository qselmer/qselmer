name: Update academic profile

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:27 in Peru (UTC-5).
    - cron: "27 11 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - "scripts/render_profile.py"
      - "assets/data/research-pipeline.json"
      - "assets/data/repository-types.json"
      - "TOPICS.md"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-academic-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh scholarly outputs, research metrics and repository portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: qselmer
          ORCID_ID: 0000-0001-9229-6379
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: qselmers@gmail.com
        run: python scripts/update_profile.py

      - name: Render outputs, pipeline and complete repository inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 0 = render every public ORCID work in the profile.
          MAX_RESEARCH_OUTPUTS: "0"
        run: python scripts/render_profile.py

      - name: Validate generated files
        run: |
          test -s README.md
          test -s assets/data/publications.json
          test -s assets/data/research-metrics.json
          test -s assets/data/repository-catalog.json
          test -s assets/data/research-pipeline.json
          test -s assets/data/repository-types.json
          test -s assets/generated/top-languages.svg
          test -s assets/generated/repository-types.svg
          test -s assets/generated/research-outputs.svg
          test -s assets/generated/research-metrics.svg
          test -s assets/generated/github-stats.svg
          python -m json.tool assets/data/publications.json >/dev/null
          python -m json.tool assets/data/research-metrics.json >/dev/null
          python -m json.tool assets/data/repository-catalog.json >/dev/null
          python -m json.tool assets/data/research-pipeline.json >/dev/null
          python -m json.tool assets/data/repository-types.json >/dev/null
          python -m py_compile scripts/update_profile.py scripts/render_profile.py
          python -m unittest discover -s tests -v

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No profile changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/data/publications.json assets/data/research-metrics.json assets/data/repository-catalog.json assets/generated/*.svg
          git commit -m "chore: refresh academic profile"
          git push
