name: Update academic profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - ".github/workflows/update-profile.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-academic-profile
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize publications and statistics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USER: qselmer
          ORCID_ID: 0000-0001-9229-6379
          OPENALEX_MAILTO: qselmers@gmail.com
        run: python scripts/update_profile.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No profile changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/data/publications.json assets/generated/*.svg
          git commit -m "chore: update academic profile"
          git push
