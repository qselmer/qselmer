name: Render centered README once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-centered-readme-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render README
        run: python scripts/render_profile.py

      - name: Validate centered icon cells
        run: |
          grep -q '<td width="12%" align="center">🔓</td>' README.md
          grep -q '<td width="16%" align="center"><img src="https://cdn.simpleicons.org/' README.md

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: center visibility and language icons"
            git push
          fi
