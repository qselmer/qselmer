name: Apply fixed table widths and zero dashes

on:
  push:
    branches:
      - fix/fixed-table-width-zero-dashes-v3
    paths:
      - scripts/apply_fixed_width_zero_dash.py
      - .github/workflows/apply-fixed-width-zero-dash.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/fixed-table-width-zero-dashes-v3
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Apply changes
        run: python scripts/apply_fixed_width_zero_dash.py

      - name: Validate
        run: |
          python -m py_compile scripts/render_profile.py scripts/update_profile.py
          python -m pytest -q \
            tests/test_profile.py::ReadmePresentationTests::test_repository_tables_use_shared_full_width_layout \
            tests/test_profile.py::OrganizationalContributionTests::test_curated_organizational_work_is_separate_from_personal_counts \
            tests/test_profile_v2.py::test_personal_repository_table_has_visibility_column \
            tests/test_profile_v2.py::test_zero_summary_values_render_as_dash
          grep -q '<table width="950">' README.md
          grep -q '>Projects</text><text[^>]*>—</text>' assets/generated/repository-types.svg
          grep -q '>Books &amp; chapters</text><text[^>]*>—</text>' assets/generated/research-outputs.svg
          grep -q '>Citations (OpenAlex)</text><text[^>]*>—</text>' assets/generated/research-metrics.svg

      - name: Remove one-off migration files
        run: |
          git rm scripts/apply_fixed_width_zero_dash.py
          git rm .github/workflows/apply-fixed-width-zero-dash.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/render_profile.py scripts/update_profile.py tests/test_profile.py tests/test_profile_v2.py assets/generated/research-outputs.svg assets/generated/research-metrics.svg assets/generated/repository-types.svg
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "fix: standardize table widths and hide zero counts"
            git push
          fi
