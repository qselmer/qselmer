name: Reorder academic profile v3

on:
  push:
    branches: [refactor/profile-ordering-v3]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/profile-ordering-v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply durable layout changes
        run: |
          python - <<'PY'
          from pathlib import Path

          render_path = Path("scripts/render_profile.py")
          text = render_path.read_text(encoding="utf-8")

          marker = "    # Remove any previously rendered scope note before rebuilding the card block.\n"
          if marker not in text:
              raise SystemExit("Expected renderer marker not found")

          insertion = '''    # Keep institutional affiliation out of the public GitHub profile header.\n    text = text.replace(\n        '\\n<p align="center"><strong>Instituto del Mar del Perú (IMARPE)</strong> · Peru</p>\\n',\n        "\\n",\n    )\n\n    # Keep the academic/profile link badges immediately below the professional title.\n    profile_links = None\n    for match in re.finditer(\n        r'\\n(<p align="center">\\s*(?:(?:<a href="[^"]+">.*?</a>)\\s*)+</p>)\\n',\n        text,\n        flags=re.S,\n    ):\n        if "Google_Scholar" in match.group(1) and "ORCID" in match.group(1):\n            profile_links = match\n            break\n    if profile_links:\n        block = profile_links.group(1)\n        start, end = profile_links.span(1)\n        text = text[:start] + text[end:]\n        text = text.replace(first_heading, first_heading + "\\n\\n" + block, 1)\n\n    # Academic outputs and metrics precede the thematic Research focus section.\n    focus_match = re.search(r'\\n## Research focus\\n.*?(?=\\n## |\\Z)', text, flags=re.S)\n    outputs_match = re.search(r'\\n## Research outputs & metrics\\n.*?(?=\\n## |\\Z)', text, flags=re.S)\n    if focus_match and outputs_match and focus_match.start() < outputs_match.start():\n        between = text[focus_match.end():outputs_match.start()]\n        if "\\n## " not in between:\n            text = (\n                text[:focus_match.start()]\n                + outputs_match.group(0)\n                + focus_match.group(0)\n                + text[outputs_match.end():]\n            )\n\n'''
          if "Keep institutional affiliation out of the public GitHub profile header." not in text:
              text = text.replace(marker, insertion + marker, 1)
          render_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_profile_v2.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              '    assert "Instituto del Mar del Perú (IMARPE)" in refined\n',
              '    assert "Instituto del Mar del Perú (IMARPE)" not in refined\n'
              '    assert refined.index("## Research outputs & metrics") < refined.index("## Research focus")\n',
          )
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Render reordered README
        run: python scripts/render_profile.py

      - name: Validate
        run: |
          python -m py_compile scripts/render_profile.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          title = '<h2 align="center">Marine Quantitative Ecologist & Fisheries Scientist</h2>'
          assert "Instituto del Mar del Perú (IMARPE)" not in text
          assert text.index("Google_Scholar") > text.index(title)
          assert text.index("Google_Scholar") < text.index('<p align="justify">')
          assert text.index("## Research outputs & metrics") < text.index("## Research focus")
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/reorder-profile-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/render_profile.py tests/test_profile_v2.py .github/workflows/reorder-profile-v3.yml
          git commit -m "refactor: reorder academic profile sections"
          git push origin refactor/profile-ordering-v3
