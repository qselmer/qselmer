name: Apply profile contract v2

on:
  push:
    branches:
      - audit/profile-contract-v2
    paths:
      - scripts/apply_profile_contract_v2.py
      - .github/workflows/apply-profile-contract-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5
        with:
          ref: audit/profile-contract-v2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply exact migration
        run: python scripts/apply_profile_contract_v2.py

      - name: Validate Python and tests
        run: |
          python -m json.tool assets/data/repository-types.json >/dev/null
          python -m py_compile scripts/update_profile.py scripts/render_profile.py
          python -m unittest discover -s tests -v

      - name: Remove one-off migration and commit result
        run: |
          rm scripts/apply_profile_contract_v2.py
          rm .github/workflows/apply-profile-contract-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: align profile taxonomy with audit contract [skip ci]"
          git push origin HEAD:audit/profile-contract-v2
